<!doctype html>
<!-- Capa do link (public/og.jpg), 1200x630. Gerada por scripts/og.mjs; abra no navegador para ajustar. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&family=Source+Sans+3:wght@400..700&family=Pinyon+Script&display=block" rel="stylesheet" />
<style>
  :root {
    --verde: #0f3d2c; --verde-noite: #0a2b1f; --creme: #efe5c8; --papel: #f6f0df;
    --pomodoro: #c4362b; --tomate-claro: #e2574a; --manjericao: #a9c99a;
  }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; }
  .capa {
    position: relative; width: 1200px; height: 630px; overflow: hidden; color: var(--creme);
    font-family: 'Source Sans 3', sans-serif;
    background:
      radial-gradient(circle at 1000px 315px, rgba(35, 104, 75, .75), transparent 420px),
      radial-gradient(ellipse 60% 70% at 0% 0%, rgba(23, 84, 60, .6), transparent 70%),
      var(--verde-noite);
  }

  /* A pizza da casa, recortada da foto (public/img/pizza-mesa-1500.webp) pelo círculo da borda. */
  .pizza {
    --d: 660px; --s: calc(var(--d) * 1.2);
    position: absolute; left: 676px; top: calc(315px - var(--d) / 2); width: var(--d); height: var(--d); border-radius: 50%;
    background: url('../public/img/pizza-mesa-1500.webp') no-repeat;
    background-size: var(--s) var(--s);
    background-position: calc(var(--d) / 2 - var(--s) * .495) calc(var(--d) / 2 - var(--s) * .523);
    box-shadow: 0 40px 80px -10px rgba(0, 0, 0, .65), 0 0 0 10px rgba(239, 229, 200, .08);
  }

  /* Selo do tomate, como um carimbo no canto da pizza. */
  .selo { position: absolute; left: 664px; top: 34px; width: 156px; height: 156px; transform: rotate(-12deg); }

  .texto {
    position: absolute; left: 68px; top: 0; bottom: 10px; width: 600px;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
  }
  .texto p { flex: none; }
  .marca { position: relative; display: inline-flex; flex-direction: column; align-items: center; line-height: 1; }
  .marca-nome { font-family: 'Pinyon Script', cursive; font-size: 66px; line-height: 1.15; padding: 0 8px; }
  .marca-cucina { font-size: 13px; font-weight: 500; letter-spacing: .6em; margin-right: -.6em; text-transform: uppercase; margin-top: -8px; }
  .marca svg { position: absolute; width: 12px; height: 12px; top: 2px; left: 50%; transform: translateX(-20%); }

  h1 {
    margin-top: 36px; font-family: 'Fraunces', serif; font-weight: 400; font-size: 80px; line-height: .98;
    letter-spacing: -.015em; font-variation-settings: 'opsz' 96;
  }
  h1 em { font-style: italic; color: var(--tomate-claro); }

  .faixa {
    display: inline-block; margin-top: 30px; padding: 9px 16px 8px; background: var(--pomodoro); color: var(--papel);
    font-size: 17px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase;
  }
  .oferta { margin-top: 20px; font-size: 22px; font-weight: 500; color: rgba(239, 229, 200, .92); }
  .oferta span { color: var(--tomate-claro); margin: 0 .35em; }
  .local { margin-top: 10px; font-size: 14px; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--manjericao); }

  .linha { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: var(--pomodoro); }
</style>
</head>
<body>
  <div class="capa">
    <div class="pizza"></div>

    <svg class="selo" viewBox="0 0 160 160" aria-hidden="true">
      <defs><path id="volta" d="M80 80 m-58 0 a58 58 0 1 1 116 0 a58 58 0 1 1 -116 0" /></defs>
      <circle cx="80" cy="80" r="78" fill="#c4362b" />
      <circle cx="80" cy="80" r="70" fill="none" stroke="#f6f0df" stroke-opacity=".35" stroke-width="1" />
      <text font-family="Source Sans 3" font-size="14" font-weight="700" fill="#f6f0df">
        <textPath href="#volta" textLength="360" lengthAdjust="spacing">FARE LA SCARPETTA · CUCINA ITALIANA · </textPath>
      </text>
      <g transform="translate(56 54) scale(2)">
        <circle cx="12" cy="14" r="8.5" fill="#f6f0df" />
        <path d="M12 6.2c-1.6-1.8-4.2-1.9-5.6-1 1.6.2 2.6 1 3.2 2-1.7-.2-3 .4-3.8 1.4 1.9-.3 3.6.2 4.6 1 .5-1 1-2 1.6-3.4Zm0 0c1.6-1.8 4.2-1.9 5.6-1-1.6.2-2.6 1-3.2 2 1.7-.2 3 .4 3.8 1.4-1.9-.3-3.6.2-4.6 1-.5-1-1-2-1.6-3.4Z" fill="#a9c99a" />
      </g>
    </svg>

    <div class="texto">
      <div class="marca">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#c4362b" /></svg>
        <span class="marca-nome">Scarpetta</span>
        <span class="marca-cucina">Cucina</span>
      </div>
      <h1>Até não sobrar<br />nada do <em>molho.</em></h1>
      <p class="faixa">Massa fresca · Pizza de fermentação natural</p>
      <p class="oferta">Risotos<span>·</span>Menu executivo<span>·</span>Eventos</p>
      <p class="local">Doda Training Center · Itatiba, SP</p>
    </div>

    <div class="linha"></div>
  </div>
</body>
</html>
